<style>
:root {
    --bg-gradient: linear-gradient(135deg, #1e1e2f 0%, #4a00e0 100%);
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
    margin: 0;
    padding: 40px 20px;
    background: var(--bg-gradient);
    color: white;
}

/* HEADER */
.header {
    text-align: center;
    margin-bottom: 30px;
}

/* SECTION */
.jb-section {
    width: 100%;
    max-width: 1200px;
    margin: auto;
    margin-bottom: 40px;
}

.section-title {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
}

/* REPO */
.jb-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.jb-btn {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 15px;
    border-radius: 18px;
    text-decoration: none;
    color: white;
    display: flex;
    justify-content: center;
    gap: 10px;
    transition: 0.3s;
}

.jb-btn:hover {
    background: white;
    color: #4a00e0;
}

/* GRID */
.app-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 20px;
}

@media (max-width: 1024px) {
    .app-grid { grid-template-columns: repeat(3, 1fr); }
    .jb-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 600px) {
    .app-grid { grid-template-columns: repeat(2, 1fr); }
    .jb-grid { grid-template-columns: 1fr; }
}

/* CARD */
.app-card {
    background: rgba(255,255,255,0.95);
    border-radius: 25px;
    padding: 20px;
    text-align: center;
    transition: 0.3s;
    color: #1d1d1f;
}

.app-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

/* ICON */
.app-icon {
    width: 100px;
    height: 100px;
    margin: 0 auto 15px;
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #f2f2f7;
}

.app-icon img {
    width: 80%;
    height: 80%;
    object-fit: contain;
    border-radius: 20px;
}

/* TEXT */
.app-name {
    font-weight: 700;
    margin-bottom: 15px;
}

/* BUTTON */
.btn-install {
    background: #1d1d1f;
    color: white;
    padding: 10px;
    border-radius: 12px;
    text-decoration: none;
    display: flex;
    justify-content: center;
    gap: 5px;
}
</style>
</head>
